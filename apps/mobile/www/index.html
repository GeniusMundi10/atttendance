<!doctype html>
<!-- PURPOSE: Offline fallback shown by the Capacitor shell when the portal cannot be reached. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELT Attendance</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#1a1917;background:linear-gradient(180deg,#fcd6c7,#fff7f3 60%)}
  main{max-width:320px;padding:24px;text-align:center}
  p{color:#6b6660}
  button{font:inherit;font-weight:600;color:#fff;background:#ff6330;border:0;border-radius:999px;padding:12px 24px;min-height:44px}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>ELT Attendance needs a connection. Kiosk punches are not affected.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
